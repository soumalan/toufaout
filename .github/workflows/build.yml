
name: Build toufaout

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source
        shell: pwsh
        run: |
          git clone --depth 1 https://code.theanig.dev/theanig/3d-analyze-reimplemented.git source

      - name: Build Win32 Release
        shell: pwsh
        run: |
          ./source/build.ps1 -Config Release

      - name: Package files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item source/build/bin/Release/3da_reborn.exe, source/build/bin/Release/control.exe, source/build/bin/Release/help.html -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath 3da-reborn-win32.zip

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: 3DA-Reborn-Win32
          path: 3da-reborn-win32.zip
